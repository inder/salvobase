name: Self-Hosted Contributor Agents

# Trigger manually from the Actions tab. Spin up 1-5 parallel contributor agents.
# Each agent picks one available issue, implements it, and opens a PR.
# Agents run directly in the upstream repo — no fork required.
#
# Requirements (set once in repo Settings → Secrets and Variables):
#   Secrets:  ANTHROPIC_API_KEY, FOUNDER_TOKEN
#   No other setup needed.

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:
    inputs:
      agent_count:
        description: "Number of parallel agents (1–5)"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      issue_numbers:
        description: "Optional: comma-separated issue numbers to target (e.g. '6,9,18'). Leave blank to auto-pick."
        required: false
        default: ""

concurrency:
  group: contributor-self
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Distribute issues across agent slots
  plan:
    name: Plan work distribution
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      has_work: ${{ steps.build.outputs.has_work }}
    steps:
      - name: Build agent matrix
        id: build
        env:
          GH_TOKEN: ${{ secrets.FOUNDER_TOKEN }}
          AGENT_COUNT: ${{ inputs.agent_count }}
          ISSUE_NUMBERS: ${{ inputs.issue_numbers }}
        run: |
          COUNT=${AGENT_COUNT:-3}

          if [ -n "$ISSUE_NUMBERS" ]; then
            # User specified issues — split them across agents
            IFS=',' read -ra ISSUES <<< "$ISSUE_NUMBERS"
            TOTAL=${#ISSUES[@]}
            MATRIX="["
            for i in $(seq 0 $((COUNT-1))); do
              IDX=$((i % TOTAL))
              ISSUE="${ISSUES[$IDX]// /}"
              [ $i -gt 0 ] && MATRIX+=","
              MATRIX+="{\"slot\":$((i+1)),\"target_issue\":\"$ISSUE\"}"
            done
            MATRIX+="]"
          else
            # Auto-pick — assign distinct issues per slot upfront to prevent races
            AVAILABLE=$(gh issue list --repo inder/salvobase --state open \
              --label "agent:available" --limit 50 \
              --json number,labels \
              --jq '[.[] | select(.labels | map(.name) | contains(["agent:claimed"]) | not)] |
                    sort_by(
                      if (.labels|map(.name)|contains(["priority:p0"])) then 0
                      elif (.labels|map(.name)|contains(["priority:critical"])) then 1
                      elif (.labels|map(.name)|contains(["priority:high"])) then 2
                      elif (.labels|map(.name)|contains(["priority:medium"])) then 3
                      else 4 end
                    ) | .[].number')

            MATRIX="["
            SLOT=1
            for ISSUE in $AVAILABLE; do
              [ $SLOT -gt $COUNT ] && break
              [ $SLOT -gt 1 ] && MATRIX+=","
              MATRIX+="{\"slot\":$SLOT,\"target_issue\":\"$ISSUE\"}"
              # Claim immediately so subsequent slots skip it
              gh issue edit "$ISSUE" --repo inder/salvobase \
                --add-label "agent:claimed" --remove-label "agent:available" || true
              SLOT=$((SLOT+1))
            done
            # Fill remaining slots with empty if not enough issues
            while [ $SLOT -le $COUNT ]; do
              [ $SLOT -gt 1 ] && MATRIX+=","
              MATRIX+="{\"slot\":$SLOT,\"target_issue\":\"none\"}"
              SLOT=$((SLOT+1))
            done
            MATRIX+="]"
          fi

          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Matrix: {\"include\":$MATRIX}"

          # has_work=true only if at least one slot has a real issue
          if echo "$MATRIX" | grep -qv '"target_issue":"none"'; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "No available issues — contribute jobs will be skipped."
          fi

  contribute:
    name: "Agent ${{ matrix.slot }}"
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
      fail-fast: false   # one agent failing shouldn't kill the others

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FOUNDER_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "founder-agent"
          git config --global user.email "founder-agent@users.noreply.github.com"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.76

      - name: Run contributor agent (slot ${{ matrix.slot }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.FOUNDER_TOKEN }}
          AGENT_SLOT: ${{ matrix.slot }}
          TARGET_ISSUE: ${{ matrix.target_issue }}
        run: python3 scripts/contributor-self/run.py

      - name: File failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: python3 scripts/founder/file_failure_issue.py
