name: Introspector Agent (Weekly)

on:
  schedule:
    - cron: '0 9 * * 1'   # every Monday 09:00 UTC
  workflow_dispatch:        # manual trigger any time

# Only one introspector run at a time. If a run is in progress, new triggers queue.
concurrency:
  group: introspector-agent
  cancel-in-progress: false

permissions:
  contents: read
  issues: write      # file new issues + read closed issues for dismissal check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  introspect:
    name: Introspector Agent Cycle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Claude Code
        # Pinned to avoid silent breakage from upstream version bumps.
        # Update this pin intentionally when you want a new version.
        run: npm install -g @anthropic-ai/claude-code@2.1.76

      - name: Run introspector cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude -p "$(cat .github/introspector-prompt.md)" \
            --allowedTools "Bash,Read,Glob,Grep" \
            --output-format text

      - name: File failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: python3 scripts/introspector/file_failure_issue.py
