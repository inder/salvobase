name: Nightly Benchmark

# Daily benchmark — perf gap is closed, so once per day is sufficient.
# The gate job still skips the expensive YCSB run if the gap is small enough.
# workflow_dispatch always bypasses the gate.

on:
  schedule:
    - cron: '0 4 * * *'   # once daily at 04:00 UTC; perf gap closed, reduced cadence
  workflow_dispatch:

permissions:
  contents: write   # needed to commit results back
  issues: write     # needed to file failure issues

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Reduced from 100k — CI runners are shared, 100k records × 2 dbs × 24 combos = hours.
  # 10k records still produces statistically meaningful ratios.
  RECORD_COUNT: "10000"
  OPERATION_COUNT: "10000"

jobs:
  gate:
    name: Adaptive gate
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest bench-data results
        run: |
          git fetch origin bench-data:bench-data || true
          mkdir -p benchmarks/results
          git show bench-data:benchmarks/index.json > benchmarks/index.json 2>/dev/null || true
          python3 scripts/bench/fetch_bench_data.py

      - name: Check gate
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          FORCE_FLAG=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then FORCE_FLAG="--force"; fi
          python3 scripts/bench/should_run_benchmark.py \
            --results-dir benchmarks/results \
            --north-star-file configs/perf_north_star \
            $FORCE_FLAG

  benchmark:
    name: Run benchmark
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build salvobase
        run: go build -o ./bin/salvobase ./cmd/mongod

      - name: Start bench stack
        run: |
          docker compose -f deployments/bench/docker-compose.yml --profile bench up -d

      - name: Wait for services
        run: |
          echo "Waiting for Salvobase health endpoint..."
          for i in $(seq 1 30); do
            if wget -qO- http://localhost:27080/health >/dev/null 2>&1; then
              echo "Salvobase ready after ${i}x2s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: Salvobase never became healthy" >&2
              docker compose -f deployments/bench/docker-compose.yml --profile bench logs salvobase >&2
              exit 1
            fi
            sleep 2
          done

          echo "Waiting for MongoDB..."
          for i in $(seq 1 30); do
            if docker exec bench-mongodb mongosh --eval "db.runCommand({ping:1})" --quiet >/dev/null 2>&1; then
              echo "MongoDB ready after ${i}x2s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: MongoDB never became healthy" >&2
              docker compose -f deployments/bench/docker-compose.yml --profile bench logs mongodb >&2
              exit 1
            fi
            sleep 2
          done

      - name: Install go-ycsb
        run: |
          # go install fails because go-ycsb uses replace directives in go.mod.
          # Clone and build from source instead.
          git clone --depth=1 https://github.com/pingcap/go-ycsb.git /tmp/go-ycsb
          cd /tmp/go-ycsb && go build -o /usr/local/bin/go-ycsb ./cmd/go-ycsb

      - name: Run benchmarks
        run: |
          DATE=$(date -u +%Y-%m-%d)
          COMMIT=$(git rev-parse --short HEAD)
          mkdir -p benchmarks/results

          # Per-night 3× sampling — single-runner noise on shared GitHub runners has
          # been measured at 6pp stddev on the Workload A ratio. Sampling 3× per
          # combination lets downstream tools (print_ratios.py, check_perf_gap.py)
          # report median ± stddev and gate alerts on real signal vs jitter. See #715.
          for WORKLOAD in A B C D E F; do
            for THREADS in 1 4 8 16; do
              for SAMPLE in 1 2 3; do
                echo "--- Workload ${WORKLOAD} / ${THREADS} threads / sample ${SAMPLE}/3 ---"

                # Salvobase — tee raw output to a debug file so failures are diagnosable
                RECORD_COUNT=$RECORD_COUNT \
                OPERATION_COUNT=$OPERATION_COUNT \
                TARGET_URL=mongodb://localhost:27017 \
                WORKLOAD=$WORKLOAD \
                THREADS=$THREADS \
                  bash scripts/bench/run_ycsb.sh \
                  2>/tmp/ycsb_stderr_salvobase_${WORKLOAD}_${THREADS}_${SAMPLE}.txt \
                  | tee /tmp/ycsb_raw_salvobase_${WORKLOAD}_${THREADS}_${SAMPLE}.txt \
                  | python3 scripts/bench/parse_ycsb.py \
                    --target salvobase \
                    --workload "$WORKLOAD" \
                    --threads "$THREADS" \
                    --commit "$COMMIT" \
                    --date "$DATE" \
                  >> "benchmarks/results/${DATE}.jsonl" \
                  || { echo "WARN: salvobase W${WORKLOAD}/T${THREADS}/S${SAMPLE} parse failed"; \
                       echo "=== stderr ===" >&2; \
                       cat /tmp/ycsb_stderr_salvobase_${WORKLOAD}_${THREADS}_${SAMPLE}.txt >&2; \
                       echo "=== raw stdout ===" >&2; \
                       cat /tmp/ycsb_raw_salvobase_${WORKLOAD}_${THREADS}_${SAMPLE}.txt >&2; }

                # MongoDB Community
                RECORD_COUNT=$RECORD_COUNT \
                OPERATION_COUNT=$OPERATION_COUNT \
                TARGET_URL=mongodb://localhost:27018 \
                WORKLOAD=$WORKLOAD \
                THREADS=$THREADS \
                  bash scripts/bench/run_ycsb.sh \
                  2>/tmp/ycsb_stderr_mongodb_${WORKLOAD}_${THREADS}_${SAMPLE}.txt \
                  | tee /tmp/ycsb_raw_mongodb_${WORKLOAD}_${THREADS}_${SAMPLE}.txt \
                  | python3 scripts/bench/parse_ycsb.py \
                    --target mongodb \
                    --workload "$WORKLOAD" \
                    --threads "$THREADS" \
                    --commit "$COMMIT" \
                    --date "$DATE" \
                  >> "benchmarks/results/${DATE}.jsonl" \
                  || { echo "WARN: mongodb W${WORKLOAD}/T${THREADS}/S${SAMPLE} parse failed"; \
                       echo "=== stderr ===" >&2; \
                       cat /tmp/ycsb_stderr_mongodb_${WORKLOAD}_${THREADS}_${SAMPLE}.txt >&2; \
                       echo "=== raw stdout ===" >&2; \
                       cat /tmp/ycsb_raw_mongodb_${WORKLOAD}_${THREADS}_${SAMPLE}.txt >&2; }
              done
            done
          done

      - name: Validate results completeness
        run: |
          DATE=$(date -u +%Y-%m-%d)
          FILE="benchmarks/results/${DATE}.jsonl"
          FAIL=0
          # Each workload should have 4 thread counts × 2 targets × 3 samples = 24 rows.
          # Threshold of 6 (≥ 2 targets × 3 samples for at least one thread count) lets
          # transient parse failures slip through without failing the whole nightly run.
          for WL in A B C D F; do  # E excluded — scan not yet implemented
            COUNT=$(grep -c "\"workload\":\"${WL}\"" "$FILE" 2>/dev/null || echo 0)
            if [ "$COUNT" -lt 6 ]; then
              echo "ERROR: Workload ${WL} has only ${COUNT} result lines (expected ≥6)"
              FAIL=1
            else
              echo "OK: Workload ${WL} — ${COUNT} lines"
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Seed index from bench-data
        run: |
          # Pull the existing index.json from bench-data so update_index.py
          # can prepend today and preserve all historical dates instead of
          # starting fresh with only today's date on every run.
          git fetch origin bench-data:bench-data || true
          mkdir -p benchmarks
          git show bench-data:benchmarks/index.json > benchmarks/index.json 2>/dev/null \
            || echo '{"dates":[]}' > benchmarks/index.json

      - name: Update index
        run: python3 scripts/bench/update_index.py

      - name: Print ratio summary
        run: python3 scripts/bench/print_ratios.py "benchmarks/results/$(date -u +%Y-%m-%d).jsonl"

      - name: Commit results
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # Push to bench-data (unprotected) — master requires CI status checks
          # that GITHUB_TOKEN cannot satisfy for direct pushes.
          # bench-data was already fetched in the "Seed index" step above.
          # If bench-data doesn't exist yet (first run), create an orphan branch.
          if git rev-parse --verify bench-data >/dev/null 2>&1; then
            git worktree add /tmp/bench-data-worktree bench-data
          else
            git worktree add --detach /tmp/bench-data-worktree
            cd /tmp/bench-data-worktree
            git checkout --orphan bench-data
            git rm -rf . >/dev/null 2>&1 || true
            cd -
          fi
          mkdir -p /tmp/bench-data-worktree/benchmarks/results
          cp -r benchmarks/results/. /tmp/bench-data-worktree/benchmarks/results/
          cp benchmarks/index.json /tmp/bench-data-worktree/benchmarks/ \
            || echo "WARN: index.json not found — skipping (update_index.py may have failed)"
          cd /tmp/bench-data-worktree
          git config user.name "salvobase-bot"
          git config user.email "salvobase-bot@users.noreply.github.com"
          git add benchmarks/
          git diff --cached --quiet || git commit -m "bench: nightly results ${DATE}"
          git push origin bench-data

      - name: Check performance gap
        # Runs after results are committed. Evaluates 3-run median ratio against
        # configs/perf_north_star and files/updates GitHub issues:
        #   gap > 10pp  → priority:p0 issue (daily pressure)
        #   0 < gap ≤ 10pp → medium issue (every 3 days)
        #   gap ≤ 0    → north-star-achieved issue (founder bumps target)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/bench/check_perf_gap.py \
            --results-dir /tmp/bench-data-worktree/benchmarks/results \
            --north-star-file configs/perf_north_star

      - name: File failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: python3 scripts/bench/file_failure_issue.py

      - name: Teardown
        if: always()
        run: docker compose -f deployments/bench/docker-compose.yml --profile bench down
