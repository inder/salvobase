name: Founder Agent (Scheduled)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # manual trigger any time

# Only one founder run at a time. If a run is in progress, new triggers queue.
concurrency:
  group: founder-agent
  cancel-in-progress: false

permissions:
  contents: write      # needed for p0 fallback: push fix branches
  issues: write
  pull-requests: write
  discussions: write   # needed for graphql discussion mutations

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  founder:
    name: Founder Agent Cycle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Use FOUNDER_TOKEN (PAT) so the founder can push fix branches
          # for the p0 perf fallback step. Falls back to GITHUB_TOKEN if
          # FOUNDER_TOKEN is not set (governance-only mode, no code pushes).
          token: ${{ secrets.FOUNDER_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "founder-agent"
          git config --global user.email "founder-agent@users.noreply.github.com"

      - name: Install Claude Code
        # Pinned to avoid silent breakage from upstream version bumps.
        # Update this pin intentionally when you want a new version.
        run: npm install -g @anthropic-ai/claude-code@2.1.76

      - name: Run founder cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.FOUNDER_TOKEN }}
        run: |
          claude -p "$(cat .github/founder-prompt.md)" \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Task,Agent" \
            --output-format text

      - name: File failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: python3 scripts/founder/file_failure_issue.py
